# Preset: Universitas Gadjah Mada (UGM)
preset_id: "ugm-skripsi"
name: "Universitas Gadjah Mada (UGM)"
description: "Format Skripsi / Laporan Tugas Akhir Universitas Gadjah Mada (Margin 4-4-3-3, Full Academic Cover)."

# Margin halaman (Standar UGM: Kiri 4cm, Atas 4cm, Bawah 3cm, Kanan 3cm)
margin_top: 4cm
margin_bottom: 3cm
margin_left: 4cm
margin_right: 3cm

# Tipografi
font_family: "Libertinus Serif"
font_size: 12pt
line_spacing: 0.75em
first_line_indent: 1.25cm

# Penomoran Heading
heading_chapter_prefix: "BAB "
heading_chapter_num_format: "roman"
heading_sub_dot: true
heading_subsub_dot: false

# Pengaturan Cover
cover_show_lecturer: true
cover_logo_width: 4cm
