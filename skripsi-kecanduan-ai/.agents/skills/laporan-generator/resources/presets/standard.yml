# Preset: Standar Modern
preset_id: "standard"
name: "Standar Modern"
description: "Format standar modern untuk laporan proyek, tugas kuliah, praktikum, dan makalah."

# Margin halaman
margin_top: 2cm
margin_bottom: 3cm
margin_left: 2.5cm
margin_right: 2.5cm

# Tipografi
font_family: "Libertinus Serif"
font_size: 12pt
line_spacing: 0.75em
first_line_indent: 1.25cm

# Penomoran Heading
heading_chapter_prefix: "BAB "
heading_chapter_num_format: "roman"
heading_sub_dot: true
heading_subsub_dot: false

# Pengaturan Cover
cover_show_lecturer: true
cover_logo_width: 4cm
